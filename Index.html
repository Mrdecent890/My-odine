<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODINE Expense & Gain Tracker</title>
    <!-- Tailwind CSS for Modern Styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js for Graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-600 text-white p-2 rounded-xl font-bold tracking-wider text-lg shadow-md shadow-indigo-500/20">OD</div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-wide text-indigo-400">ODINE</h1>
                    <p class="text-xs text-slate-400">Expense & Gain Tracker</p>
                </div>
            </div>
            <button onclick="resetData()" class="text-slate-400 hover:text-red-400 text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg transition">
                <i class="fa-solid fa-rotate-right mr-1"></i> Reset
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto w-full p-4 flex-grow space-y-5 pb-24">

        <!-- Balance Card -->
        <div class="bg-gradient-to-br from-indigo-900/80 via-slate-900 to-slate-900 border border-indigo-500/30 rounded-2xl p-5 shadow-xl relative overflow-hidden">
            <div class="absolute -right-4 -bottom-4 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>
            <p class="text-xs font-medium text-indigo-300 uppercase tracking-wider">Current Balance</p>
            <h2 id="totalBalance" class="text-3xl font-extrabold mt-1 tracking-tight text-white">₹0.00</h2>
            
            <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-slate-800/80">
                <div>
                    <span class="text-xs text-emerald-400 flex items-center"><i class="fa-solid fa-arrow-down-long mr-1.5"></i> Total Gain</span>
                    <p id="totalGain" class="text-lg font-bold text-emerald-400 mt-0.5">₹0</p>
                </div>
                <div>
                    <span class="text-xs text-rose-400 flex items-center"><i class="fa-solid fa-arrow-up-long mr-1.5"></i> Total Spent</span>
                    <p id="totalExpense" class="text-lg font-bold text-rose-400 mt-0.5">₹0</p>
                </div>
            </div>
        </div>

        <!-- Action Form Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg">
            <h3 class="text-sm font-semibold text-slate-300 mb-3 flex items-center">
                <i class="fa-solid fa-pen-to-square text-indigo-400 mr-2"></i> Add Transaction
            </h3>
            
            <form id="transactionForm" onsubmit="addTransaction(event)" class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="typeGainBtn" onclick="setTxType('gain')" class="py-2 px-3 text-xs font-semibold rounded-xl border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 transition flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-plus-circle"></i> <span>Gain / Salary</span>
                    </button>
                    <button type="button" id="typeExpBtn" onclick="setTxType('expense')" class="py-2 px-3 text-xs font-semibold rounded-xl border border-slate-800 bg-slate-800 text-slate-400 transition flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-minus-circle"></i> <span>Expense</span>
                    </button>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Description (e.g. Salary, Rent, Food)</label>
                    <input type="text" id="txDesc" required placeholder="Enter title..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Amount (₹)</label>
                        <input type="number" id="txAmount" required min="1" placeholder="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Category</label>
                        <select id="txCategory" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                            <option value="Salary">Salary / Income</option>
                            <option value="Food">Food & Dining</option>
                            <option value="Travel">Travel & Fuel</option>
                            <option value="Bills">Bills & Utilities</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl text-sm shadow-lg shadow-indigo-600/30 transition mt-2">
                    Add Gain
                </button>
            </form>
        </div>

        <!-- Graph Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg">
            <h3 class="text-sm font-semibold text-slate-300 mb-3 flex items-center justify-between">
                <span><i class="fa-solid fa-chart-pie text-indigo-400 mr-2"></i> Expense Breakdown</span>
                <span class="text-xs text-slate-500 font-normal">By Category</span>
            </h3>
            <div class="relative w-full h-48 flex justify-center items-center">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <!-- History Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg">
            <h3 class="text-sm font-semibold text-slate-300 mb-3 flex items-center justify-between">
                <span><i class="fa-solid fa-clock-rotate-left text-indigo-400 mr-2"></i> Recent History</span>
                <span id="txCount" class="text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-400">0 items</span>
            </h3>
            <div id="transactionList" class="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                <!-- Dynamic Items will load here -->
                <div class="text-center py-6 text-slate-500 text-xs">No transactions recorded yet.</div>
            </div>
        </div>

    </main>

    <!-- Footer Credit -->
    <footer class="text-center py-3 text-slate-600 text-[11px] border-t border-slate-900 bg-slate-950">
        ODINE System &bull; Offline Mode Active
    </footer>

    <!-- Script Logic -->
    <script>
        let transactions = JSON.parse(localStorage.getItem('odine_transactions')) || [];
        let currentType = 'gain'; // 'gain' or 'expense'
        let expenseChart = null;

        function setTxType(type) {
            currentType = type;
            const gainBtn = document.getElementById('typeGainBtn');
            const expBtn = document.getElementById('typeExpBtn');
            const submitBtn = document.getElementById('submitBtn');

            if (type === 'gain') {
                gainBtn.className = "py-2 px-3 text-xs font-semibold rounded-xl border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 transition flex items-center justify-center space-x-1";
                expBtn.className = "py-2 px-3 text-xs font-semibold rounded-xl border border-slate-800 bg-slate-800 text-slate-400 transition flex items-center justify-center space-x-1";
                submitBtn.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-xl text-sm shadow-lg shadow-emerald-600/30 transition mt-2";
                submitBtn.innerText = "Add Gain";
            } else {
                expBtn.className = "py-2 px-3 text-xs font-semibold rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-400 transition flex items-center justify-center space-x-1";
                gainBtn.className = "py-2 px-3 text-xs font-semibold rounded-xl border border-slate-800 bg-slate-800 text-slate-400 transition flex items-center justify-center space-x-1";
                submitBtn.className = "w-full bg-rose-600 hover:bg-rose-500 text-white font-medium py-2.5 rounded-xl text-sm shadow-lg shadow-rose-600/30 transition mt-2";
                submitBtn.innerText = "Add Expense";
            }
        }

        function addTransaction(e) {
            e.preventDefault();
            const desc = document.getElementById('txDesc').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            const category = document.getElementById('txCategory').value;

            const newTx = {
                id: Date.now(),
                desc,
                amount,
                category,
                type: currentType,
                date: new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short' })
            };

            transactions.unshift(newTx);
            saveAndRefresh();
            document.getElementById('transactionForm').reset();
            setTxType('gain');
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            saveAndRefresh();
        }

        function resetData() {
            if(confirm("Are you sure you want to reset all data?")) {
                transactions = [];
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('odine_transactions', JSON.stringify(transactions));
            updateUI();
        }

        function updateUI() {
            let totalGain = 0;
            let totalExpense = 0;
            let categoryTotals = { Food: 0, Travel: 0, Bills: 0, Shopping: 0, Other: 0, Salary: 0 };

            const listEl = document.getElementById('transactionList');
            listEl.innerHTML = '';

            if (transactions.length === 0) {
                listEl.innerHTML = '<div class="text-center py-6 text-slate-500 text-xs">No transactions recorded yet.</div>';
                document.getElementById('txCount').innerText = '0 items';
            } else {
                document.getElementById('txCount').innerText = `${transactions.length} items`;
                transactions.forEach(t => {
                    if (t.type === 'gain') {
                        totalGain += t.amount;
                    } else {
                        totalExpense += t.amount;
                        if(categoryTotals[t.category] !== undefined) {
                            categoryTotals[t.category] += t.amount;
                        } else {
                            categoryTotals['Other'] += t.amount;
                        }
                    }

                    const item = document.createElement('div');
                    item.className = "flex items-center justify-between bg-slate-950/60 border border-slate-800/80 p-3 rounded-xl";
                    item.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-xl flex items-center justify-center ${t.type === 'gain' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">
                                <i class="fa-solid ${t.type === 'gain' ? 'fa-arrow-down' : 'fa-arrow-up'} text-xs"></i>
                            </div>
                            <div>
                                <h4 class="text-xs font-semibold text-slate-200">${t.desc}</h4>
                                <p class="text-[10px] text-slate-500">${t.category} &bull; ${t.date}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-xs font-bold ${t.type === 'gain' ? 'text-emerald-400' : 'text-rose-400'}">
                                ${t.type === 'gain' ? '+' : '-'}₹${t.amount.toLocaleString('en-IN')}
                            </span>
                            <button onclick="deleteTransaction(${t.id})" class="text-slate-600 hover:text-rose-400 text-xs transition">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            }

            const netBalance = totalGain - totalExpense;
            document.getElementById('totalBalance').innerText = `₹${netBalance.toLocaleString('en-IN')}`;
            document.getElementById('totalGain').innerText = `₹${totalGain.toLocaleString('en-IN')}`;
            document.getElementById('totalExpense').innerText = `₹${totalExpense.toLocaleString('en-IN')}`;

            updateChart(categoryTotals);
        }

        function updateChart(catData) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            
            const dataValues = [catData.Food, catData.Travel, catData.Bills, catData.Shopping, catData.Other, catData.Salary];
            
            if (expenseChart) {
                expenseChart.data.datasets[0].data = dataValues;
                expenseChart.update();
                return;
            }

            expenseChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Food', 'Travel', 'Bills', 'Shopping', 'Other', 'Salary'],
                    datasets: [{
                        data: dataValues,
                        backgroundColor: ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#8b5cf6', '#3b82f6'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                boxWidth: 10,
                                font: { size: 10 },
                                color: '#94a3b8'
                            }
                        }
                    },
                    cutout: '70%'
                }
            });
        }

        // Initial Load
        updateUI();
    </script>
</body>
  </html>
